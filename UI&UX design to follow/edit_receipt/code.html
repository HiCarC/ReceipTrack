<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Receipt</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#135bec",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
              "surface-dark": "#282e39", /* Matching the provided snippet input background */
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"],
              "body": ["Noto Sans", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.25rem", 
              "lg": "0.5rem", 
              "xl": "0.75rem", 
              "2xl": "1rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
        /* Hide scrollbar for cleaner mobile look */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom date input styling for dark mode consistency */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white min-h-screen flex flex-col antialiased selection:bg-primary/30">
<!-- Top App Bar -->
<div class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-white/5">
<div class="flex items-center justify-between p-4 h-16">
<button class="flex items-center justify-center size-10 -ml-2 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-white/5 rounded-full transition-colors">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-2">Edit Receipt</h2>
<button class="text-primary text-base font-bold leading-normal tracking-wide shrink-0 hover:text-blue-400 transition-colors">
                Save
            </button>
</div>
</div>
<!-- Main Content -->
<div class="flex-1 overflow-y-auto scrollbar-hide pb-10">
<!-- Receipt Preview & Amount -->
<div class="flex flex-col items-center pt-6 pb-8 px-6">
<!-- Receipt Thumbnail -->
<div class="relative group cursor-pointer mb-6">
<div class="w-24 h-32 rounded-xl overflow-hidden shadow-lg ring-1 ring-black/5 dark:ring-white/10 bg-white dark:bg-surface-dark bg-center bg-cover transition-transform transform group-hover:scale-105" data-alt="Small thumbnail preview of the scanned receipt" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBWQP4Tka5VqlbkEygWMHzs2ucUYYBmTwY-pOFlqQLPNqQBl7blRA_KfBhJxXBj8MO3vh0r_WDYmLHamjKRNGiGsGJtQBks4fDYmeCQS-BE1MLzvY7NGHjrDMhd0yUdR10cCxVfSpgp1C1mEd345jylwq_EbsC_70S4ie2XxN-YH_DXC7USnswLwLbW_c1rBZ8b-Qb58k_-GJuN86ib_IYVqsHluSQo2V2m6tqPZM1MPXx1LCb4MHbBCZdOjlaN2-Dt-oUapT4k3Y-e');">
</div>
<div class="absolute -bottom-2 -right-2 bg-primary text-white rounded-full p-1.5 shadow-md flex items-center justify-center">
<span class="material-symbols-outlined text-sm">zoom_in</span>
</div>
</div>
<!-- Total Amount Input -->
<div class="w-full max-w-xs text-center">
<label class="text-slate-500 dark:text-slate-400 text-sm font-medium mb-1 block">Total Amount</label>
<div class="relative flex items-center justify-center">
<span class="text-4xl font-bold text-slate-900 dark:text-white absolute left-0 w-full text-right pr-[60%] pointer-events-none opacity-0 sm:opacity-100">$</span>
<div class="flex items-baseline justify-center gap-1">
<span class="text-3xl font-bold text-slate-400">$</span>
<input class="w-40 bg-transparent border-b-2 border-slate-200 dark:border-white/10 focus:border-primary text-center text-5xl font-extrabold text-slate-900 dark:text-white focus:outline-none focus:ring-0 p-0 pb-2 placeholder-slate-300 dark:placeholder-slate-700 transition-colors" placeholder="0.00" type="text" value="42.50"/>
</div>
</div>
</div>
</div>
<!-- Form Fields Container -->
<div class="px-4 space-y-5 max-w-lg mx-auto">
<!-- Merchant Name -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Merchant Name</label>
<div class="relative group">
<input class="w-full bg-white dark:bg-surface-dark text-slate-900 dark:text-white rounded-xl border-none h-14 pl-12 pr-4 focus:ring-2 focus:ring-primary placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-shadow shadow-sm" value="Starbucks Coffee"/>
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">storefront</span>
</div>
</div>
</div>
<!-- Date & Currency Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Date</label>
<div class="relative group">
<input class="w-full bg-white dark:bg-surface-dark text-slate-900 dark:text-white rounded-xl border-none h-14 pl-12 pr-4 focus:ring-2 focus:ring-primary transition-shadow shadow-sm [color-scheme:light] dark:[color-scheme:dark]" type="date" value="2023-10-24"/>
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors pointer-events-none">
<span class="material-symbols-outlined">calendar_today</span>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Currency</label>
<div class="relative group">
<select class="w-full bg-white dark:bg-surface-dark text-slate-900 dark:text-white rounded-xl border-none h-14 pl-4 pr-10 focus:ring-2 focus:ring-primary transition-shadow shadow-sm appearance-none">
<option value="USD">USD ($)</option>
<option value="EUR">EUR (€)</option>
<option value="GBP">GBP (£)</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Category -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Category</label>
<div class="relative group">
<select class="w-full bg-white dark:bg-surface-dark text-slate-900 dark:text-white rounded-xl border-none h-14 pl-12 pr-10 focus:ring-2 focus:ring-primary transition-shadow shadow-sm appearance-none">
<option>Food &amp; Dining</option>
<option>Transportation</option>
<option>Entertainment</option>
<option>Office Supplies</option>
</select>
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-primary">
<span class="material-symbols-outlined">restaurant</span>
</div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Payment Method -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Payment Method</label>
<div class="relative group">
<select class="w-full bg-white dark:bg-surface-dark text-slate-900 dark:text-white rounded-xl border-none h-14 pl-12 pr-10 focus:ring-2 focus:ring-primary transition-shadow shadow-sm appearance-none">
<option>Visa •••• 4242</option>
<option>Mastercard •••• 8888</option>
<option>Personal Cash</option>
</select>
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors pointer-events-none">
<span class="material-symbols-outlined">credit_card</span>
</div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Group Split Toggle -->
<div class="mt-2 bg-white dark:bg-surface-dark rounded-xl p-4 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-10 rounded-full bg-blue-100 dark:bg-blue-500/20 text-blue-600 dark:text-blue-400">
<span class="material-symbols-outlined">group</span>
</div>
<div class="flex flex-col">
<span class="text-slate-900 dark:text-white font-bold text-sm">Split with Group</span>
<span class="text-slate-500 dark:text-slate-400 text-xs">Share this expense</span>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary/50 dark:peer-focus:ring-primary/40 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
<div class="h-4"></div>
<!-- Line Items Section -->
<div>
<div class="flex items-center justify-between mb-3 px-1">
<h3 class="text-slate-900 dark:text-white font-bold text-base">Line Items</h3>
<button class="flex items-center gap-1 text-primary text-sm font-bold hover:underline">
<span class="material-symbols-outlined text-lg">add</span>
                        Add Item
                    </button>
</div>
<div class="bg-white dark:bg-surface-dark rounded-xl overflow-hidden shadow-sm flex flex-col divide-y divide-slate-100 dark:divide-white/5">
<!-- Line Item 1 -->
<div class="p-4 flex gap-3 items-start group">
<div class="flex-1 space-y-2">
<input class="w-full bg-transparent border-none p-0 text-slate-900 dark:text-white font-semibold text-base focus:ring-0 placeholder-slate-400" placeholder="Item name" type="text" value="Caramel Macchiato"/>
<div class="flex items-center gap-3">
<div class="flex items-center bg-slate-100 dark:bg-background-dark rounded-lg px-2 py-1">
<span class="text-xs text-slate-500 mr-2">Qty</span>
<input class="w-8 bg-transparent border-none p-0 text-center text-sm font-medium focus:ring-0 text-slate-900 dark:text-white" type="number" value="1"/>
</div>
</div>
</div>
<div class="flex flex-col items-end justify-between h-full gap-2">
<div class="flex items-center">
<span class="text-slate-400 text-sm mr-1">$</span>
<input class="w-16 bg-transparent border-none p-0 text-right text-slate-900 dark:text-white font-bold focus:ring-0" type="text" value="5.50"/>
</div>
<button class="text-slate-400 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
</div>
<!-- Line Item 2 -->
<div class="p-4 flex gap-3 items-start group">
<div class="flex-1 space-y-2">
<input class="w-full bg-transparent border-none p-0 text-slate-900 dark:text-white font-semibold text-base focus:ring-0 placeholder-slate-400" placeholder="Item name" type="text" value="Bagel w/ Cream Cheese"/>
<div class="flex items-center gap-3">
<div class="flex items-center bg-slate-100 dark:bg-background-dark rounded-lg px-2 py-1">
<span class="text-xs text-slate-500 mr-2">Qty</span>
<input class="w-8 bg-transparent border-none p-0 text-center text-sm font-medium focus:ring-0 text-slate-900 dark:text-white" type="number" value="2"/>
</div>
</div>
</div>
<div class="flex flex-col items-end justify-between h-full gap-2">
<div class="flex items-center">
<span class="text-slate-400 text-sm mr-1">$</span>
<input class="w-16 bg-transparent border-none p-0 text-right text-slate-900 dark:text-white font-bold focus:ring-0" type="text" value="12.00"/>
</div>
<button class="text-slate-400 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
</div>
</div>
<!-- Helper text -->
<p class="text-xs text-slate-400 dark:text-slate-500 mt-2 px-1 text-right">
                    Calculated total: <span class="text-slate-700 dark:text-slate-300 font-medium">$17.50</span>
</p>
</div>
<!-- Notes -->
<div class="flex flex-col gap-2 pt-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Notes</label>
<textarea class="w-full bg-white dark:bg-surface-dark text-slate-900 dark:text-white rounded-xl border-none p-4 min-h-[120px] focus:ring-2 focus:ring-primary placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-shadow shadow-sm resize-none" placeholder="Add any details about this expense..."></textarea>
</div>
<!-- Delete Button -->
<div class="pt-6 pb-8">
<button class="w-full py-3.5 rounded-xl border border-red-200 dark:border-red-900/30 bg-red-50 dark:bg-red-900/10 text-red-600 dark:text-red-400 font-bold text-base hover:bg-red-100 dark:hover:bg-red-900/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">delete</span>
                    Delete Receipt
                </button>
</div>
</div>
</div>
</body></html>
