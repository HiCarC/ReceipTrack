<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settle Up Payment</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Manrope -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "surface-dark": "#1c222e",
                        "surface-darker": "#151b26",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem", 
                        "lg": "0.5rem", 
                        "xl": "0.75rem", 
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom utilities */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white h-screen flex flex-col overflow-hidden antialiased selection:bg-primary/30">
<!-- Header -->
<header class="flex items-center justify-between p-4 pt-6 bg-background-light dark:bg-background-dark shrink-0 z-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[28px]">close</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Settle Up</h1>
<div class="w-10 h-10"></div> <!-- Spacer for visual balance -->
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto hide-scrollbar flex flex-col items-center w-full max-w-md mx-auto relative px-4 pb-32">
<!-- Payer/Receiver Flow -->
<div class="w-full py-8">
<div class="flex items-center justify-between px-4">
<!-- Payer (You) -->
<div class="flex flex-col items-center gap-3 w-1/3 group cursor-pointer">
<div class="relative">
<div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-surface-dark border-2 border-transparent group-hover:border-primary transition-all p-1">
<div class="w-full h-full rounded-full bg-cover bg-center shadow-lg" data-alt="Portrait of a woman with dark hair" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBvB-u4WSBIfHegUpf61i9owaMTRpdQNqL2-I0lcIKRRxPQgyHgKWRE1j1lINSeYbKcSwyceFqYzDi_EtTEeauIh8cLCOAnzjCwNpNz2rM78WCnhTrFqU895OnqSZYuJylF-mbNAzoD5LGxhyTsdEn0ee6AdE28Hdv1YDOwKE72ZeLyBOPw7LvLjY04KYBiihUImwZV6B5Fc_9uGk4fTzY3b8uu2EyNEX7Dz7i36pvKHCv1gj9zu5CQg9gibe4xopNZTqP7phyFwE4M');"></div>
</div>
<div class="absolute -bottom-1 -right-1 bg-surface-darker rounded-full p-1 border border-surface-dark">
<span class="material-symbols-outlined text-[16px] text-gray-400">expand_more</span>
</div>
</div>
<span class="text-sm font-semibold text-gray-300 group-hover:text-white transition-colors">You</span>
</div>
<!-- Directional Flow -->
<div class="flex flex-col items-center justify-center w-1/3 -mt-6">
<div class="w-full h-[2px] bg-gradient-to-r from-transparent via-primary/50 to-transparent mb-[-13px] opacity-50"></div>
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary animate-pulse border border-primary/20">
<span class="material-symbols-outlined text-[24px]">arrow_forward</span>
</div>
<span class="text-xs text-primary font-medium mt-2">Paying</span>
</div>
<!-- Receiver (Sarah) -->
<div class="flex flex-col items-center gap-3 w-1/3 group cursor-pointer">
<div class="relative">
<div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-surface-dark border-2 border-transparent group-hover:border-primary transition-all p-1">
<div class="w-full h-full rounded-full bg-cover bg-center shadow-lg" data-alt="Portrait of a man with glasses and a beard" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAEEPK6iyXyDDYxDt7JBaMu8YeH9AP3bDSlYsuNjL_Hug9DK27fN7OAQ1w8alMQaafeD9nbQUgFEeMmPVs1P86tkhOKQq-9NXilaAAIoglZUgQfdmJ-QljOSvd9Q-CpfPey-V9DdrKQDE5DkVNOqOOrj3Dpq4LBjTjMFt8b8p1IFKum1yIc3f5_vJMgql0jJnYpNviyXUGiHnO_Z-8068DspE_LGzLpWtGoY4VKbPAN8KqIdpoUMJSEkyvWIdjCj3HiCpfMnh1ONFC5');"></div>
</div>
<div class="absolute -bottom-1 -right-1 bg-surface-darker rounded-full p-1 border border-surface-dark">
<span class="material-symbols-outlined text-[16px] text-gray-400">expand_more</span>
</div>
</div>
<span class="text-sm font-semibold text-gray-300 group-hover:text-white transition-colors">Sarah</span>
</div>
</div>
</div>
<!-- Amount Section -->
<div class="flex flex-col items-center w-full mb-8">
<div class="flex items-center justify-center relative">
<span class="text-4xl text-gray-500 font-bold mr-1 self-start mt-2">$</span>
<input aria-label="Amount to pay" class="bg-transparent text-center text-7xl font-extrabold text-white w-full max-w-[280px] focus:outline-none placeholder-gray-700 caret-primary p-0 border-none focus:ring-0 leading-tight" inputmode="decimal" type="text" value="45.50"/>
<!-- Currency Selector -->
<button class="absolute -right-12 top-1/2 -translate-y-1/2 flex items-center gap-0.5 px-2 py-1 bg-surface-dark hover:bg-surface-darker rounded-lg text-xs font-bold text-gray-400 transition-colors">
                    USD <span class="material-symbols-outlined text-[14px]">arrow_drop_down</span>
</button>
</div>
<!-- Quick Action Chip -->
<button class="mt-6 group flex items-center gap-2 bg-surface-dark hover:bg-surface-darker active:scale-95 border border-white/5 px-4 py-2 rounded-full transition-all duration-200">
<span class="material-symbols-outlined text-[18px] text-primary">receipt_long</span>
<span class="text-sm font-medium text-gray-300 group-hover:text-white">Full amount owing: <span class="text-white font-bold">$45.50</span></span>
</button>
</div>
<!-- Details Form -->
<div class="w-full space-y-3">
<!-- Date Picker -->
<div class="group flex items-center justify-between p-4 bg-surface-dark rounded-2xl cursor-pointer hover:bg-surface-dark/80 transition border border-transparent hover:border-primary/20">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">calendar_today</span>
</div>
<div class="flex flex-col">
<span class="text-xs text-gray-400 font-medium uppercase tracking-wide">Date</span>
<span class="text-base font-semibold text-white">Today, Oct 24</span>
</div>
</div>
<span class="material-symbols-outlined text-gray-600 group-hover:text-white transition-colors">chevron_right</span>
</div>
<!-- Note Input -->
<div class="group flex items-start p-4 bg-surface-dark rounded-2xl cursor-text hover:bg-surface-dark/80 transition border border-transparent focus-within:border-primary/50">
<div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center text-primary mr-4 shrink-0 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">edit_note</span>
</div>
<div class="flex flex-col flex-1 gap-1">
<label class="text-xs text-gray-400 font-medium uppercase tracking-wide cursor-pointer" for="note-input">Note</label>
<input class="bg-transparent w-full text-base font-medium text-white placeholder-gray-500 focus:outline-none border-none p-0 focus:ring-0" id="note-input" placeholder="What is this for?" type="text"/>
</div>
</div>
<!-- Location (Optional flair) -->
<div class="group flex items-center justify-between p-4 bg-surface-dark rounded-2xl cursor-pointer hover:bg-surface-dark/80 transition border border-transparent hover:border-primary/20">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">location_on</span>
</div>
<div class="flex flex-col">
<span class="text-xs text-gray-400 font-medium uppercase tracking-wide">Location</span>
<span class="text-base font-semibold text-white">Seattle, WA</span>
</div>
</div>
<div class="w-12 h-12 rounded-lg overflow-hidden border border-white/10 opacity-70 group-hover:opacity-100 transition-opacity">
<div class="w-full h-full bg-cover bg-center" data-alt="Abstract map view of city streets" data-location="Seattle, WA" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDnsKhaUYOUwHN-bhbmE819sBAz1PBe96ojLMEaF0CM98LrqEsv-FMci4oYpu_nWjuAjwLzouSLbxgdZlDUSthKTZ1DGgjM8JUYzF9mD_y7KdWy_EeCak2eglvMV2aqNUstZhLpB8APO1s3ZTpzvPSJOlJ8puRYegZyjNmRqFRgf7M_TrzGr2OTqgwylhHpglldlU0vrhQ_W4L5x7-8eCOn20w8mhJDHXRl-4icmYUD-t0SMwM-QkG5gC500TVDHvNDWO6Lp585Bk3H');">
</div>
</div>
</div>
</div>
</main>
<!-- Sticky Footer Action -->
<div class="fixed bottom-0 left-0 w-full z-20">
<!-- Gradient Overlay for smooth fade -->
<div class="h-12 w-full bg-gradient-to-t from-background-dark to-transparent pointer-events-none"></div>
<div class="bg-background-dark px-4 pb-8 pt-2">
<button class="w-full bg-primary hover:bg-blue-600 active:scale-[0.98] text-white font-bold h-14 rounded-2xl text-lg flex items-center justify-center gap-2 transition-all shadow-[0_8px_20px_-6px_rgba(19,91,236,0.5)]">
<span>Confirm Payment</span>
<span class="material-symbols-outlined">check_circle</span>
</button>
<p class="text-center text-xs text-gray-500 mt-3 font-medium">Recorded as a reimbursement</p>
</div>
</div>
</body></html>
