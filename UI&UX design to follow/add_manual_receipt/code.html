<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Manual Receipt</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "surface-dark": "#1c2333", // Custom surface color for cards
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
<div class="flex items-center px-4 py-3 justify-between">
<button class="text-gray-500 dark:text-gray-400 text-base font-medium leading-normal tracking-[0.015em] shrink-0 hover:text-gray-800 dark:hover:text-white transition-colors">
                Cancel
            </button>
<h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">
                Add Receipt
            </h2>
<button class="text-primary text-base font-bold leading-normal tracking-[0.015em] shrink-0 hover:text-blue-400 transition-colors">
                Save
            </button>
</div>
</header>
<main class="flex-1 overflow-y-auto pb-24">
<!-- Total Amount Section -->
<div class="pt-8 pb-6 px-6 text-center">
<label class="block text-gray-500 dark:text-gray-400 text-sm font-semibold mb-2 uppercase tracking-wider">Total Amount</label>
<div class="flex items-center justify-center gap-2">
<div class="relative">
<select class="appearance-none bg-transparent text-gray-900 dark:text-white text-xl font-bold pr-6 border-none focus:ring-0 focus:outline-none cursor-pointer">
<option value="USD">$</option>
<option value="EUR">€</option>
<option value="GBP">£</option>
<option value="JPY">¥</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none text-sm">expand_more</span>
</div>
<input autofocus="" class="bg-transparent border-none p-0 text-5xl font-extrabold text-gray-900 dark:text-white placeholder-gray-300 dark:placeholder-gray-700 w-48 text-center focus:ring-0 focus:outline-none" inputmode="decimal" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Core Details Form -->
<div class="px-4 space-y-6">
<!-- Merchant Input -->
<div class="bg-surface-light dark:bg-surface-dark rounded-xl p-4 shadow-sm border border-gray-200 dark:border-gray-800">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined">storefront</span>
</div>
<div class="flex-1">
<label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Merchant</label>
<input class="w-full bg-transparent border-none p-0 text-base text-gray-900 dark:text-white placeholder-gray-400 focus:ring-0" placeholder="e.g. Starbucks" type="text"/>
</div>
</div>
</div>
<!-- Date & Payment Row -->
<div class="flex gap-4">
<!-- Date Picker -->
<div class="flex-1 bg-surface-light dark:bg-surface-dark rounded-xl p-4 shadow-sm border border-gray-200 dark:border-gray-800">
<label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-2">Date</label>
<div class="flex items-center gap-2 text-gray-900 dark:text-white">
<span class="material-symbols-outlined text-gray-400 dark:text-gray-500">calendar_today</span>
<input class="bg-transparent border-none p-0 text-sm font-medium focus:ring-0 w-full text-gray-900 dark:text-white [color-scheme:light] dark:[color-scheme:dark]" type="date" value="2023-10-27"/>
</div>
</div>
<!-- Payment Method -->
<div class="flex-1 bg-surface-light dark:bg-surface-dark rounded-xl p-4 shadow-sm border border-gray-200 dark:border-gray-800">
<label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-2">Payment</label>
<div class="relative w-full">
<select class="w-full bg-transparent border-none p-0 pr-6 text-sm font-medium text-gray-900 dark:text-white focus:ring-0 appearance-none">
<option>Personal Card</option>
<option>Cash</option>
<option>Corporate Card</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 pointer-events-none text-base">expand_more</span>
</div>
</div>
</div>
<!-- Category Selector -->
<div>
<div class="flex justify-between items-center mb-3">
<h3 class="text-sm font-bold text-gray-900 dark:text-white">Category</h3>
<button class="text-primary text-xs font-semibold">Edit</button>
</div>
<div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2">
<!-- Active Item -->
<button class="flex flex-col items-center gap-2 min-w-[72px] group">
<div class="w-14 h-14 rounded-full bg-primary text-white flex items-center justify-center shadow-lg shadow-primary/30 transition-transform active:scale-95">
<span class="material-symbols-outlined">restaurant</span>
</div>
<span class="text-xs font-medium text-primary">Food</span>
</button>
<!-- Inactive Items -->
<button class="flex flex-col items-center gap-2 min-w-[72px] group">
<div class="w-14 h-14 rounded-full bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 flex items-center justify-center group-hover:border-gray-400 dark:group-hover:border-gray-500 transition-colors active:scale-95">
<span class="material-symbols-outlined">directions_car</span>
</div>
<span class="text-xs font-medium text-gray-500 dark:text-gray-400 group-hover:text-gray-700 dark:group-hover:text-gray-300">Transport</span>
</button>
<button class="flex flex-col items-center gap-2 min-w-[72px] group">
<div class="w-14 h-14 rounded-full bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 flex items-center justify-center group-hover:border-gray-400 dark:group-hover:border-gray-500 transition-colors active:scale-95">
<span class="material-symbols-outlined">shopping_cart</span>
</div>
<span class="text-xs font-medium text-gray-500 dark:text-gray-400 group-hover:text-gray-700 dark:group-hover:text-gray-300">Groceries</span>
</button>
<button class="flex flex-col items-center gap-2 min-w-[72px] group">
<div class="w-14 h-14 rounded-full bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 flex items-center justify-center group-hover:border-gray-400 dark:group-hover:border-gray-500 transition-colors active:scale-95">
<span class="material-symbols-outlined">flight</span>
</div>
<span class="text-xs font-medium text-gray-500 dark:text-gray-400 group-hover:text-gray-700 dark:group-hover:text-gray-300">Travel</span>
</button>
<button class="flex flex-col items-center gap-2 min-w-[72px] group">
<div class="w-14 h-14 rounded-full bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 flex items-center justify-center group-hover:border-gray-400 dark:group-hover:border-gray-500 transition-colors active:scale-95">
<span class="material-symbols-outlined">more_horiz</span>
</div>
<span class="text-xs font-medium text-gray-500 dark:text-gray-400 group-hover:text-gray-700 dark:group-hover:text-gray-300">More</span>
</button>
</div>
</div>
<!-- Line Items Section -->
<div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 overflow-hidden">
<div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-800/50">
<h3 class="text-sm font-bold text-gray-900 dark:text-white">Line Items</h3>
<button class="flex items-center gap-1 text-primary text-sm font-medium hover:text-blue-400">
<span class="material-symbols-outlined text-lg">add</span>
                        Add Item
                    </button>
</div>
<!-- Example Item 1 -->
<div class="p-4 border-b border-gray-200 dark:border-gray-800 flex items-start gap-3">
<div class="flex-1">
<input class="w-full bg-transparent border-none p-0 text-sm font-medium text-gray-900 dark:text-white placeholder-gray-400 focus:ring-0 mb-1" type="text" value="Latte"/>
<input class="w-full bg-transparent border-none p-0 text-xs text-gray-500 dark:text-gray-400 placeholder-gray-500 focus:ring-0" placeholder="Description (optional)" type="text"/>
</div>
<div class="w-20 text-right">
<input class="w-full bg-transparent border-none p-0 text-sm font-medium text-gray-900 dark:text-white text-right focus:ring-0" type="text" value="4.50"/>
</div>
</div>
<!-- Example Item 2 (Empty state) -->
<div class="p-4 flex items-start gap-3 opacity-60">
<div class="flex-1">
<input class="w-full bg-transparent border-none p-0 text-sm font-medium text-gray-900 dark:text-white placeholder-gray-400 focus:ring-0 mb-1" placeholder="Item name" type="text"/>
</div>
<div class="w-20 text-right">
<input class="w-full bg-transparent border-none p-0 text-sm font-medium text-gray-900 dark:text-white text-right focus:ring-0" placeholder="0.00" type="text"/>
</div>
</div>
</div>
<!-- Notes & Attachments -->
<div class="bg-surface-light dark:bg-surface-dark rounded-xl p-4 shadow-sm border border-gray-200 dark:border-gray-800">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-gray-400 dark:text-gray-500 mt-1">description</span>
<textarea class="flex-1 bg-transparent border-none p-0 text-sm text-gray-900 dark:text-white placeholder-gray-400 resize-none focus:ring-0 leading-relaxed" placeholder="Add notes..." rows="3"></textarea>
</div>
<div class="mt-4 pt-3 border-t border-gray-200 dark:border-gray-800 flex items-center justify-between">
<span class="text-xs text-gray-500 dark:text-gray-400 font-medium">Attachments</span>
<button class="flex items-center gap-2 bg-gray-100 dark:bg-gray-700/50 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg px-3 py-1.5 transition-colors">
<span class="material-symbols-outlined text-gray-600 dark:text-gray-300 text-lg">attach_file</span>
<span class="text-xs font-semibold text-gray-700 dark:text-gray-200">Add Photo</span>
</button>
</div>
</div>
</div>
</main>
<!-- Floating Action Button Area (for easy thumb reach) -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent pt-8">
<button class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-900/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">check</span>
            Save Receipt
        </button>
</div>
</body></html>
