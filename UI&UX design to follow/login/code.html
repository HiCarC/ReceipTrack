<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ExpenseApp Login</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "surface-dark": "#1C2333", // Derived for input fields/cards on dark bg
                        "text-secondary": "#9da6b9",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem", 
                        "lg": "0.5rem", 
                        "xl": "0.75rem", 
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto">
<!-- Header Image Section -->
<div class="@container">
<div class="@[480px]:px-4 @[480px]:py-3 pt-4 px-4">
<div class="w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden rounded-xl min-h-[160px] relative shadow-lg" data-alt="Abstract blue financial data visualization with floating geometric shapes" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDRPd01Kx8qrFHqb0WwatDu0YAHHfIL88c43pfyiTkXL22qCpJ81ZOc8HE_cJpfryXA-rcKk64Jd06RMG7F517ZnXXDtVHFSXjt4nZXWohU2T6vYPrDkCKBYI5ILLjW2gZuxpwmS8Te7ybASq6fYT6kXIr6sAZNyJnku2VvEUtXjpjrKx9ZtlF2IJrxypwtxOsHzdok-M5Kqrk8wyBJG0cyx-T-1BYwrlPoe1XdNifqK5v8ImvYOe0TIyoPfPljFOewJHOf7spMLcgm");'>
<div class="absolute inset-0 bg-gradient-to-t from-background-dark/90 via-background-dark/20 to-transparent"></div>
<div class="absolute top-4 left-4 bg-white/10 backdrop-blur-md p-2 rounded-lg border border-white/10">
<span class="material-symbols-outlined text-white" style="font-size: 24px;">account_balance_wallet</span>
</div>
</div>
</div>
</div>
<!-- Headline -->
<div class="flex flex-col px-4 pt-4 pb-2">
<h1 class="text-slate-900 dark:text-white tracking-tight text-[32px] font-extrabold leading-tight">Welcome back</h1>
<p class="text-slate-500 dark:text-text-secondary text-base font-normal leading-normal pt-2">Please enter your details to sign in.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-4 px-4 py-4" onsubmit="event.preventDefault();">
<!-- Email Field -->
<label class="flex flex-col gap-1.5">
<span class="text-sm font-medium text-slate-900 dark:text-white ml-1">Email address</span>
<div class="relative flex items-center">
<div class="absolute left-4 text-text-secondary flex items-center pointer-events-none">
<span class="material-symbols-outlined" style="font-size: 20px;">mail</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-none bg-white dark:bg-surface-dark focus:border-none h-14 placeholder:text-text-secondary pl-12 pr-4 text-base font-normal leading-normal shadow-sm" placeholder="john@example.com" type="email" value=""/>
</div>
</label>
<!-- Password Field -->
<label class="flex flex-col gap-1.5">
<span class="text-sm font-medium text-slate-900 dark:text-white ml-1">Password</span>
<div class="flex w-full flex-1 items-stretch rounded-xl bg-white dark:bg-surface-dark shadow-sm relative group focus-within:ring-2 focus-within:ring-primary/50">
<div class="absolute left-4 top-0 bottom-0 text-text-secondary flex items-center pointer-events-none z-10">
<span class="material-symbols-outlined" style="font-size: 20px;">lock</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-xl text-slate-900 dark:text-white focus:outline-0 focus:ring-0 border-none bg-transparent focus:border-none h-14 placeholder:text-text-secondary pl-12 pr-2 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<button class="text-text-secondary flex items-center justify-center px-4 rounded-r-xl hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 24px;">visibility</span>
</button>
</div>
</label>
<!-- Forgot Password -->
<div class="flex justify-end pt-1">
<a class="text-sm font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary hover:bg-blue-600 text-white font-bold h-14 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98] mt-2 text-[16px]">
                Sign In
            </button>
<!-- Divider -->
<div class="relative py-4 flex items-center">
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
<span class="flex-shrink-0 mx-4 text-slate-400 dark:text-slate-600 text-sm font-medium">Or continue with</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
</div>
<!-- Social Login Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 h-12 bg-white dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors shadow-sm" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-semibold text-slate-700 dark:text-white">Google</span>
</button>
<button class="flex items-center justify-center gap-2 h-12 bg-white dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors shadow-sm" type="button">
<svg class="w-5 h-5 text-black dark:text-white fill-current" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.47-1.09-.42-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.47C2.7 15.25 3.66 7.59 11.1 7.5c1.95 0 3.09 1.18 4.04 1.18.96 0 2.62-1.18 4.43-1.07 1.54.09 2.92.83 3.93 2.31-3.56 2.07-2.91 6.51.68 8.08-.66 1.48-1.57 3-2.67 4.54-.53.79-1.25 1.57-1.92 1.95-1.18.7-2.05-.28-2.54-.2zm-3.14-16c.3 2.14-1.46 4.2-3.3 4.41-.33-2.15 1.63-4.22 3.3-4.41z"></path>
</svg>
<span class="text-sm font-semibold text-slate-700 dark:text-white">Apple</span>
</button>
</div>
</form>
<!-- Footer -->
<div class="mt-auto pb-8 pt-4">
<p class="text-center text-base text-slate-500 dark:text-text-secondary">
                New to ExpenseApp? <a class="text-primary font-bold hover:underline" href="#">Create account</a>
</p>
</div>
<!-- Bottom Spacer -->
<div class="h-4 w-full"></div>
</div>
</body></html>
